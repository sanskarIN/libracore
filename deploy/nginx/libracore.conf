# LibraCore reference Nginx configuration.
#
# This is an operator starting point, not a drop-in production certificate or
# capacity policy. Replace example paths/hostnames and tune limits from measured
# traffic before deployment.

worker_processes auto;
pid /run/nginx.pid;


events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;

    # Keep the login budget intentionally much tighter than normal API traffic.
    # The zones are per client IP as observed by this Nginx instance.
    limit_req_zone $binary_remote_addr zone=libracore_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=libracore_api:10m rate=20r/s;
    limit_req_status 429;

    upstream libracore_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name library.example.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name library.example.org;

        ssl_certificate     /etc/letsencrypt/live/library.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/library.example.org/privkey.pem;

        root /srv/libracore/frontend;
        index index.html;

        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # Authentication receives a separate, conservative per-IP budget.
        location = /api/auth/login {
            limit_req zone=libracore_login burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://libracore_backend;
        }

        # Normal authenticated API traffic uses a larger bounded burst.
        location /api/ {
            limit_req zone=libracore_api burst=40 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://libracore_backend;
        }

        # Do not publish the actuator surface broadly. This example permits a
        # same-host health probe only; adapt to the trusted probe network used by
        # the deployment platform.
        location = /actuator/health {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://libracore_backend;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
