name: Rebaseline 0.1.1 Frontend Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebaseline-lockfile-0-1-1
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate package lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'No package-lock.json change was produced.'
            exit 0
          fi
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add frontend/package-lock.json
          git commit -m 'build(release): regenerate frontend lockfile for 0.1.1'
          git push origin HEAD:main
