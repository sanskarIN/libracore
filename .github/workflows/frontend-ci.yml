name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/check-version.mjs'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/check-version.mjs'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require committed dependency lock
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "frontend/package-lock.json is required for reproducible frontend CI." >&2
            echo "Run the Frontend Lockfile Bootstrap workflow or generate and commit it locally." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify manifest versions match
        run: node scripts/check-version.mjs

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend quality gate
        working-directory: frontend
        run: npm run check
