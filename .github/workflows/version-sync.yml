name: Version Sync

on:
  push:
    branches: [main]
    paths:
      - 'backend/pom.xml'
      - 'frontend/package.json'
      - 'scripts/check-version.mjs'
      - '.github/workflows/version-sync.yml'
  pull_request:
    paths:
      - 'backend/pom.xml'
      - 'frontend/package.json'
      - 'scripts/check-version.mjs'
      - '.github/workflows/version-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify manifest versions match
        run: node scripts/check-version.mjs
