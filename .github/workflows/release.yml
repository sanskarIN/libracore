name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: libracore_test
          POSTGRES_USER: libracore
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libracore -d libracore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/libracore_test
      DB_USERNAME: libracore
      DB_PASSWORD: test-password
      APP_NOTIFICATION_MODE: MOCK

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package backend
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --ignore-scripts

      - name: Verify frontend
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm run test:run && npm run build

      - name: Package frontend
        run: tar -C frontend -czf libracore-web-${GITHUB_REF_NAME}.tar.gz dist

      - name: Collect backend artifact
        run: cp backend/target/libracore-backend-0.1.0-SNAPSHOT.jar libracore-backend-${GITHUB_REF_NAME}.jar

      - name: Create checksums
        run: sha256sum libracore-backend-${GITHUB_REF_NAME}.jar libracore-web-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            libracore-backend-${{ github.ref_name }}.jar
            libracore-web-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
