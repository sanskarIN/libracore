name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: libracore_test
          POSTGRES_USER: libracore
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libracore -d libracore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/libracore_test
      DB_USERNAME: libracore
      DB_PASSWORD: test-password
      APP_NOTIFICATION_MODE: MOCK

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require committed frontend lockfile
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "frontend/package-lock.json must be committed before creating a release tag." >&2
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package backend
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Start packaged backend
        shell: bash
        run: |
          set -euo pipefail
          backend_jar="$(find backend/target -maxdepth 1 -type f -name 'libracore-backend-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "$backend_jar" ]]; then
            echo "No packaged LibraCore backend JAR was found." >&2
            exit 1
          fi
          java -jar "$backend_jar" > /tmp/libracore-release-backend.log 2>&1 &
          echo $! > /tmp/libracore-release-backend.pid

      - name: Verify packaged backend health
        run: curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 http://localhost:8080/actuator/health

      - name: Verify packaged backend readiness
        run: curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 http://localhost:8080/actuator/health/readiness

      - name: Verify packaged build metadata and safe actuator info
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            http://localhost:8080/actuator/info > /tmp/libracore-release-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/libracore-release-info.json').read_text())
          build = payload.get('build', {})
          if build.get('version') != '1.1.6':
              raise SystemExit(f"Unexpected build version: {build.get('version')!r}")
          if 'env' in payload or 'git' in payload:
              raise SystemExit('Actuator info exposed disabled environment or Git metadata.')
          print('Packaged build metadata and safe Actuator info verified for 1.1.6.')
          PY

      - name: Install frontend dependencies reproducibly
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Package frontend
        run: tar -C frontend -czf libracore-web-${GITHUB_REF_NAME}.tar.gz dist

      - name: Collect backend artifact
        shell: bash
        run: |
          set -euo pipefail
          backend_jar="$(find backend/target -maxdepth 1 -type f -name 'libracore-backend-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "$backend_jar" ]]; then
            echo "No packaged LibraCore backend JAR was found." >&2
            exit 1
          fi
          cp "$backend_jar" "libracore-backend-${GITHUB_REF_NAME}.jar"

      - name: Create checksums
        run: sha256sum libracore-backend-${GITHUB_REF_NAME}.jar libracore-web-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          files: |
            libracore-backend-${{ github.ref_name }}.jar
            libracore-web-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt

      - name: Stop packaged backend
        if: always()
        run: |
          if [ -f /tmp/libracore-release-backend.pid ]; then
            kill "$(cat /tmp/libracore-release-backend.pid)" 2>/dev/null || true
          fi

      - name: Print packaged backend log on failure
        if: failure()
        run: cat /tmp/libracore-release-backend.log || true