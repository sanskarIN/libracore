name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: libracore_test
          POSTGRES_USER: libracore
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libracore -d libracore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/libracore_test
      DB_USERNAME: libracore
      DB_PASSWORD: test-password
      APP_NOTIFICATION_MODE: MOCK

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package backend
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - name: Require committed frontend lockfile
        run: test -f frontend/package-lock.json

      - name: Install frontend dependencies reproducibly
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Package frontend
        run: tar -C frontend -czf libracore-web-${GITHUB_REF_NAME}.tar.gz dist

      - name: Collect backend artifact
        shell: bash
        run: |
          set -euo pipefail
          backend_jar="$(find backend/target -maxdepth 1 -type f -name 'libracore-backend-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "$backend_jar" ]]; then
            echo "No packaged LibraCore backend JAR was found." >&2
            exit 1
          fi
          cp "$backend_jar" "libracore-backend-${GITHUB_REF_NAME}.jar"

      - name: Create checksums
        run: sha256sum libracore-backend-${GITHUB_REF_NAME}.jar libracore-web-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            libracore-backend-${{ github.ref_name }}.jar
            libracore-web-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
