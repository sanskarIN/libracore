name: Frontend Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/frontend-lockfile.yml'

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Generate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add frontend/package-lock.json
          git commit -m "build: refresh frontend dependency lockfile"
          git push origin HEAD:main
