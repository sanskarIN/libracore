name: Lockfile Sync

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Synchronize lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add frontend/package-lock.json
          git commit -m "chore(release): synchronize frontend lockfile"
          git push
