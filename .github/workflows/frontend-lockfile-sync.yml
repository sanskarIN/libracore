name: Frontend Lockfile Sync

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-lockfile-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate package lock metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Frontend lockfile is already synchronized.'
            exit 0
          fi

          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add frontend/package-lock.json
          git commit -m 'chore(release): synchronize frontend lockfile metadata'
          git push
