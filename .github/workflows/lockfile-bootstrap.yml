name: Frontend Lockfile Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - automation/lockfile-bootstrap-3
    paths:
      - .github/lockfile-bootstrap-kick
  pull_request:
    branches:
      - main
    paths:
      - .github/lockfile-bootstrap-kick

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  generate-and-verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'automation/lockfile-bootstrap-3' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- frontend/package-lock.json)" ]]; then
            echo "frontend/package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add frontend/package-lock.json
          git commit -m "build: lock frontend dependencies for 2.0.12"
          git push origin HEAD:main
