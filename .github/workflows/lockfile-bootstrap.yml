name: Frontend Lockfile Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - automation/lockfile-bootstrap-2
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- frontend/package-lock.json)" ]]; then
            echo "frontend/package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add frontend/package-lock.json
          git commit -m "build: lock frontend dependencies for 2.0.12"
          git push origin HEAD:main
