name: Frontend Lockfile Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/lockfile-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: frontend-package-lock-generated
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- frontend/package-lock.json)" ]]; then
            echo "frontend/package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add frontend/package-lock.json
          version="$(node -p "require('./frontend/package.json').version")"
          git commit -m "build: synchronize frontend lockfile for ${version}"
          git push origin HEAD:main
