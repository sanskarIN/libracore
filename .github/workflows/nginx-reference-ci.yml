name: Nginx Reference CI

on:
  push:
    branches: [main]
    paths:
      - 'deploy/nginx/**'
      - 'scripts/check-nginx-reference.sh'
      - '.github/workflows/nginx-reference-ci.yml'
  pull_request:
    paths:
      - 'deploy/nginx/**'
      - 'scripts/check-nginx-reference.sh'
      - '.github/workflows/nginx-reference-ci.yml'

permissions:
  contents: read

concurrency:
  group: nginx-reference-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx openssl

      - name: Check validation script syntax
        run: bash -n scripts/check-nginx-reference.sh

      - name: Validate Nginx reference
        run: bash scripts/check-nginx-reference.sh
