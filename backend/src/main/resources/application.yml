server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB

spring:
  application:
    name: libracore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/libracore}
    username: ${DB_USERNAME:libracore}
    password: ${DB_PASSWORD:libracore-dev-only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    build:
      enabled: true
    env:
      enabled: false
    git:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session:
    ttl-hours: ${APP_SESSION_TTL_HOURS:12}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  notifications:
    mode: ${APP_NOTIFICATION_MODE:MOCK}
    from: ${APP_NOTIFICATION_FROM:no-reply@example.invalid}
    dispatch-interval-ms: ${APP_NOTIFICATION_DISPATCH_INTERVAL_MS:5000}
  reservations:
    expiry-scan-ms: ${APP_RESERVATION_EXPIRY_SCAN_MS:60000}

logging:
  level:
    root: INFO
    com.sanskar.libracore: INFO
