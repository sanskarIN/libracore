server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: libracore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/libracore}
    username: ${DB_USERNAME:libracore}
    password: ${DB_PASSWORD:libracore-dev-only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session:
    ttl-hours: ${APP_SESSION_TTL_HOURS:12}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.sanskar.libracore: INFO
