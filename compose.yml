services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libracore}
      POSTGRES_USER: ${POSTGRES_USER:-libracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libracore-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libracore} -d ${POSTGRES_DB:-libracore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - libracore-postgres:/var/lib/postgresql/data

volumes:
  libracore-postgres:
